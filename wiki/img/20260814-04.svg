<svg xmlns="http://www.w3.org/2000/svg" width="880" height="534" viewBox="0 0 880 534" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,'IPAGothic','Droid Sans Japanese',sans-serif">
<rect width="880" height="534" fill="#ffffff"/>
<text x="24" y="30" font-size="22" font-weight="bold" fill="#1f2328">ony-yow の wiki 化</text>
<text x="24" y="52" font-size="13" fill="#656d76">20260814-04 / 実行 / 上段 = 朝の計画（O・N・Y） / 下段 = 夕の検証（O2・O 実測・W）</text>
<rect x="24.0" y="70.0" width="270.7" height="207.0" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36.0" y="97.0" font-size="15" font-weight="bold" fill="#0969da">O 起きていること</text>
<text x="36.0" y="125.0" font-size="16" fill="#1f2328">仮説検証Wiki（hypothesis-wiki）</text>
<text x="36.0" y="151.0" font-size="16" fill="#1f2328">を作ったが、個人レベルで試すに</text>
<text x="36.0" y="177.0" font-size="16" fill="#1f2328">は多数の仮説検証を回すのが難し</text>
<text x="36.0" y="203.0" font-size="16" fill="#1f2328">かった</text>
<rect x="304.7" y="70.0" width="270.7" height="207.0" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="316.7" y="97.0" font-size="15" font-weight="bold" fill="#0969da">N 望んでいること</text>
<text x="316.7" y="125.0" font-size="16" fill="#1f2328">自分が、シンプルな仮説検証をこ</text>
<text x="316.7" y="151.0" font-size="16" fill="#1f2328">のツールを使って記録できる。続</text>
<text x="316.7" y="177.0" font-size="16" fill="#1f2328">けられる</text>
<rect x="585.3" y="70.0" width="270.7" height="207.0" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="597.3" y="97.0" font-size="15" font-weight="bold" fill="#0969da">Y やってみること</text>
<text x="597.3" y="125.0" font-size="16" fill="#1f2328">個人が日常で使えるツールとして</text>
<text x="597.3" y="151.0" font-size="16" fill="#1f2328">ony-yow を wiki 化する → </text>
<text x="597.3" y="177.0" font-size="16" fill="#1f2328">ony-yow を wiki 化し、グリルミー</text>
<text x="597.3" y="203.0" font-size="16" fill="#1f2328">対話で1日目の記録を一巡させた</text>
<text x="597.3" y="229.0" font-size="16" fill="#1f2328">（対話スキルの修正も同日に実施）</text>
<rect x="24.0" y="287.0" width="270.7" height="207.0" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36.0" y="314.0" font-size="15" font-weight="bold" fill="#bc4c00">O2 起きそうなこと</text>
<text x="36.0" y="342.0" font-size="16" fill="#1f2328">とりあえず1日目の記録ができる。</text>
<text x="36.0" y="368.0" font-size="16" fill="#1f2328">ツールの気に入らない点が見つか</text>
<text x="36.0" y="394.0" font-size="16" fill="#1f2328">る</text>
<rect x="304.7" y="287.0" width="270.7" height="207.0" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="316.7" y="314.0" font-size="15" font-weight="bold" fill="#bc4c00">O 起きたこと</text>
<text x="316.7" y="342.0" font-size="16" fill="#1f2328">カードに記録され、ドラフト PR </text>
<text x="316.7" y="368.0" font-size="16" fill="#1f2328">を投げるところまで確認できた。</text>
<text x="316.7" y="394.0" font-size="16" fill="#1f2328">ただし日次 PR に機能修正（スキー</text>
<text x="316.7" y="420.0" font-size="16" fill="#1f2328">マ変更）のコミットが混ざった</text>
<rect x="585.3" y="287.0" width="270.7" height="207.0" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="597.3" y="314.0" font-size="15" font-weight="bold" fill="#bc4c00">W 分かったこと</text>
<text x="597.3" y="342.0" font-size="16" fill="#1f2328">継続して使いやすいかはまだクエ</text>
<text x="597.3" y="368.0" font-size="16" fill="#1f2328">スチョン。private 運用のままで</text>
<text x="597.3" y="394.0" font-size="16" fill="#1f2328">は、slide-wiki の Pages 公開は</text>
<text x="597.3" y="420.0" font-size="16" fill="#1f2328">個人 GitHub では無理（public </text>
<text x="597.3" y="446.0" font-size="16" fill="#1f2328">化が必要）</text>
<text x="24" y="520" font-size="13" fill="#656d76">検証済 / eiji / 2026-08-14T16:36</text>
</svg>
